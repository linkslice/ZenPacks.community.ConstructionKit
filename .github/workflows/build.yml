name: Build and Release Egg

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-20.04  # Use an older Ubuntu version that still supports Python 2.7

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python 2.7
        run: |
          sudo apt update
          sudo apt install -y python2 python2-dev python-pip
          python2 -m pip install --upgrade pip setuptools wheel

      - name: Build Egg
        run: |
          python2 setup.py bdist_egg

      - name: Upload Egg as Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.egg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

